<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Episode — PodCast' : 'New Episode — PodCast'">Form — PodCast</title>
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/episodes}">
        <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></span>
        <span><span class="accent">Pod</span>Cast</span>
    </a>
</nav>

<div class="main">
    <div class="breadcrumb">
        <a th:href="@{/episodes}">My Queue</a> /
        <span th:text="${editMode} ? 'Edit episode' : 'New episode'"></span>
    </div>

    <div class="form-card">
        <h2 class="form-title" th:text="${editMode} ? 'Edit Episode' : 'Add a New Episode'"></h2>

        <form th:action="${editMode} ? @{/episodes/edit/{id}(id=${episode.id})} : @{/episodes/new}"
              method="post" th:object="${episode}">

            <div class="form-grid">

                <div class="section-label">Episode Info</div>

                <div class="fg full">
                    <label for="title" class="required">Episode Title</label>
                    <input id="title" class="form-control" type="text" th:field="*{title}" placeholder="e.g. The Wellness Industrial Complex">
                    <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>

                <div class="fg">
                    <label for="name" class="required">Show Name</label>
                    <input id="name" class="form-control" type="text" th:field="*{showName}" placeholder="e.g. Maintenance Phase">
                    <span class="field-error" th:if="${#fields.hasErrors('showName')}" th:errors="*{showName}"></span>
                </div>

                <div class="fg">
                    <label for="hosts" class="required">Hosts</label>
                    <input id="hosts" class="form-control" type="text" th:field="*{hosts}" placeholder="e.g. Aubrey Gordon, Michael Hobbes">
                    <span class="field-error" th:if="${#fields.hasErrors('hosts')}" th:errors="*{hosts}"></span>
                </div>

                <div class="fg">
                    <label for="guests">Guests</label>
                    <input id="guests" class="form-control" type="text" th:field="*{guests}" placeholder="e.g. Brian Chesky">
                </div>

                <div class="fg">
                    <label for="network">Network</label>
                    <input id="network" class="form-control" type="text" th:field="*{network}" placeholder="e.g. Spotify, Acast">
                </div>

                <div class="fg">
                    <label for="epNumber">Episode Number</label>
                    <input id="epNumber" class="form-control" type="text" th:field="*{episodeNumber}" placeholder="e.g. S3E12, EP 178">
                </div>

                <div class="fg">
                    <label for="seasonNumber">Season Number</label>
                    <input id="seasonNumber" class="form-control" type="number" th:field="*{seasonNumber}" min="1" max="50" placeholder="e.g. 3">
                </div>

                <div class="fg">
                    <label for="category" class="required">Category</label>
                    <select id="category" class="form-select" th:field="*{category}">
                        <option value="">Select...</option>
                        <option th:each="c : ${categories}" th:value="${c}"
                                th:text="${#strings.replace(c.name(),'_',' ')}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                </div>

                <div class="fg">
                    <label for="listeningStatus" class="required">Listening Status</label>
                    <select id="listeningStatus" class="form-select" th:field="*{status}">
                        <option value="">Select...</option>
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${#strings.replace(s.name(),'_',' ')}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                </div>

                <div class="section-label">Listening Details</div>

                <div class="fg">
                    <label for="listeningContext">Listening Context</label>
                    <select id="listeningContext" class="form-select" th:field="*{listeningContext}">
                        <option value="">Select...</option>
                        <option th:each="c : ${contexts}" th:value="${c}"
                                th:text="${#strings.replace(c.name(),'_',' ')}"></option>
                    </select>
                </div>

                <div class="fg">
                    <label for="speed">Playback Speed</label>
                    <select id="speed" class="form-select" th:field="*{playbackSpeed}">
                        <option value="">Select...</option>
                        <option th:each="s : ${speeds}" th:value="${s}"
                                th:text="${#strings.replace(#strings.replace(s.name(),'SPEED_',''),'_','.')}"></option>
                    </select>
                </div>

                <div class="fg">
                    <label for="duration">Duration (minutes)</label>
                    <input id="duration" class="form-control" type="number" th:field="*{durationMinutes}" min="1" max="900" placeholder="e.g. 92">
                    <span class="field-error" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></span>
                </div>

                <div class="fg">
                    <label for="minListened">Minutes Listened</label>
                    <input id="minListened" class="form-control" type="number" th:field="*{minutesListened}" min="0" max="900" placeholder="e.g. 45">
                    <span class="field-error" th:if="${#fields.hasErrors('minutesListened')}" th:errors="*{minutesListened}"></span>
                </div>

                <div class="fg">
                    <label for="rating">Rating (1-5 stars)</label>
                    <input id="rating" class="form-control" type="number" th:field="*{rating}" min="1" max="5" placeholder="1-5">
                    <span class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>
                </div>

                <div class="fg">
                    <label for="releaseDate">Release Date</label>
                    <input id="releaseDate" class="form-control" type="date" th:field="*{releaseDate}">
                </div>

                <div class="fg">
                    <label for="listenedDate">Listened Date</label>
                    <input id="listenedDate" class="form-control" type="date" th:field="*{listenedDate}">
                </div>

                <div class="fg">
                    <label for="mainTopic">Main Topic</label>
                    <input id="mainTopic" class="form-control" type="text" th:field="*{mainTopic}" placeholder="e.g. Wellness industry, dopamine">
                </div>

                <div class="section-label">Quality Scores (1-10)</div>

                <div class="fg">
                    <label for="Contentquality">📝 Content Quality</label>
                    <input id="Contentquality" class="form-control" type="number" th:field="*{contentQuality}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label for="audioQuality">🎙 Audio Quality</label>
                    <input id="audioQuality" class="form-control" type="number" th:field="*{audioQuality}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label for="hostChem">🤝 Host Chemistry</label>
                    <input id="hostChem" class="form-control" type="number" th:field="*{hostChemistry}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label for="value">⟳ Re-listen Value</label>
                    <input id="value" class="form-control" type="number" th:field="*{rewatchValue}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-wrap" for="subscribed">
                        <input id="subscribed" type="checkbox" th:field="*{subscribed}">
                        <span class="checkbox-label"><span class="checkbox-title">⭐ Subscribed</span></span>
                    </label>
                    <label class="checkbox-wrap" for="recommendToFriend">
                        <input id="recommendToFriend" type="checkbox" th:field="*{recommendToFriend}">
                        <span class="checkbox-label"><span class="checkbox-title">♡ Recommend</span></span>
                    </label>
                    <label class="checkbox-wrap" for="bookmarkedQuote">
                        <input id="bookmarkedQuote" type="checkbox" th:field="*{bookmarkedQuote}">
                        <span class="checkbox-label"><span class="checkbox-title">🔖 Bookmarked</span></span>
                    </label>
                    <label class="checkbox-wrap" for="explicitContent">
                        <input id="explicitContent" type="checkbox" th:field="*{explicitContent}">
                        <span class="checkbox-label"><span class="checkbox-title">🅴 Explicit</span></span>
                    </label>
                </div>

                <div class="section-label">Listening Journal</div>

                <div class="fg full">
                    <label for="tags">Mood / Vibe Tags</label>
                    <input id="tags" class="form-control" type="text" th:field="*{moodTags}" placeholder="e.g. Chaotic, hilarious, mid-week therapy">
                    <span class="field-error" th:if="${#fields.hasErrors('moodTags')}" th:errors="*{moodTags}"></span>
                </div>

                <div class="fg full">
                    <label for="memorableQuote">Memorable Quote</label>
                    <textarea class="form-control" th:field="*{memorableQuote}" placeholder="A line that stuck with you..." id="memorableQuote"></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('memorableQuote')}" th:errors="*{memorableQuote}"></span>
                </div>

                <div class="fg full">
                    <label for="takeaway">💡 Key Takeaway</label>
                    <input id="takeaway" class="form-control" type="text" th:field="*{keyTakeaway}" placeholder="The main lesson or insight you took away">
                    <span class="field-error" th:if="${#fields.hasErrors('keyTakeaway')}" th:errors="*{keyTakeaway}"></span>
                </div>

                <div class="fg full">
                    <label for="review">My Review</label>
                    <textarea id="review" class="form-control" th:field="*{review}" placeholder="Worth listening? Hot takes?"></textarea>
                </div>

                <div class="fg full">
                    <label for="notes">Personal Notes</label>
                    <textarea id="notes" class="form-control" th:field="*{personalNotes}" placeholder="Private thoughts, follow-ups, things to remember..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <a th:href="@{/episodes}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${editMode} ? 'Save changes' : 'Add to Queue'"></button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
