<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${episode.title} + ' — PodCast'">Episode — PodCast</title>
    <link rel="stylesheet" th:href="@{/css/detail.css}">

</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/episodes}">
        <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></span>
        <span><span class="accent">Pod</span>Cast</span>
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/episodes}">My Queue</a></li>
        <li><span class="user-badge" sec:authentication="name">user</span></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" id="logoutstyle">
                <button type="submit" class="btn btn-outline btn-sm">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<div class="main">
    <div class="breadcrumb">
        <a th:href="@{/episodes}">My Queue</a> / <span th:text="${episode.title}"></span>
    </div>

    <div class="detail-card">
        <div class="status-stripe-large" th:classappend="${#strings.toLowerCase(episode.status.name())}"></div>

        <div class="hero">
            <div class="show-line-hero">
                <span class="subscribed-icon" th:if="${episode.subscribed}">⭐</span>
                <span th:text="${episode.showName}"></span>
                <span th:if="${episode.episodeNumber != null and !episode.episodeNumber.isBlank()}"
                      th:text="' · ' + ${episode.episodeNumber}"></span>
            </div>
            <div class="episode-title" th:text="${episode.title}"></div>

            <div class="hosts-line">
                <strong>Hosts:</strong> <span th:text="${episode.hosts}"></span>
            </div>
            <div class="hosts-line" th:if="${episode.guests != null and !episode.guests.isBlank()}">
                <strong>Guest:</strong> <span th:text="${episode.guests}"></span>
            </div>
            <div class="meta-line">
                <span th:if="${episode.network != null and !episode.network.isBlank()}" th:text="${episode.network}"></span>
                <span th:if="${episode.durationMinutes != null}" th:text="' · ' + ${episode.durationMinutes} + ' min'"></span>
                <span th:if="${episode.releaseDate != null}" th:text="' · ' + ${#temporals.format(episode.releaseDate, 'dd MMM yyyy')}"></span>
            </div>

            <div class="stars-large" th:if="${episode.rating != null}">
                <span th:each="i : ${#numbers.sequence(1,5)}"
                      th:classappend="${i <= episode.rating} ? 'star-filled' : 'star-empty'"
                      th:text="${i <= episode.rating} ? '★' : '☆'"></span>
            </div>

            <div class="badges-row">
                <span class="badge"
                      th:classappend="'badge-status-' + ${#strings.toLowerCase(episode.status.name())}"
                      th:text="${#strings.replace(episode.status.name(),'_',' ')}"></span>
                <span class="badge badge-category"
                      th:text="${#strings.replace(episode.category.name(),'_',' ')}"></span>
                <span class="badge badge-context" th:if="${episode.listeningContext != null}"
                      th:text="'🎧 ' + ${#strings.replace(episode.listeningContext.name(),'_',' ')}"></span>
                <span class="badge badge-speed" th:if="${episode.playbackSpeed != null}"
                      th:text="${#strings.replace(#strings.replace(episode.playbackSpeed.name(),'SPEED_',''),'_','.')}"></span>
                <span class="badge badge-explicit" th:if="${episode.explicitContent}">🅴 Explicit</span>
            </div>
        </div>

        <div class="body-section">

            <div class="player-card"
                 th:if="${episode.durationMinutes != null and episode.minutesListened != null and episode.minutesListened > 0}"
                 th:with="percent=${(episode.minutesListened * 100) / episode.durationMinutes}">
                <div class="player-header">
                    <span class="player-title">Listening Progress</span>
                    <span class="player-percent" th:text="${percent} + '%'"></span>
                </div>
                <div class="player-bar">
                    <progress class="player-fill"
                              th:value="${percent}"
                              max="100"
                              aria-label="Listening progress"></progress>
                </div>
                <div class="player-time">
                    <span th:text="${episode.minutesListened} + ':00'"></span>
                    <span th:text="${episode.durationMinutes} + ':00'"></span>
                </div>
            </div>

            <div class="quality-section"
                 th:if="${episode.contentQuality != null or episode.audioQuality != null or episode.hostChemistry != null or episode.rewatchValue != null}">
                <div class="section-title">Quality Breakdown</div>
                <div class="quality-large-grid">
                    <div class="quality-card" th:if="${episode.contentQuality != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">📝 Content</span>
                            <span class="quality-card-score" th:text="${episode.contentQuality} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <progress class="quality-card-fill"
                                      th:value="${episode.contentQuality}"
                                      max="10"
                                      aria-label="Content quality"></progress>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.audioQuality != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">🎙 Audio</span>
                            <span class="quality-card-score" th:text="${episode.audioQuality} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <progress class="quality-card-fill"
                                      th:value="${episode.audioQuality}"
                                      max="10"
                                      aria-label="Audio quality"></progress>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.hostChemistry != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">🤝 Host Chemistry</span>
                            <span class="quality-card-score" th:text="${episode.hostChemistry} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <progress class="quality-card-fill"
                                      th:value="${episode.hostChemistry}"
                                      max="10"
                                      aria-label="Host chemistry"></progress>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.rewatchValue != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">⟳ Re-listen</span>
                            <span class="quality-card-score" th:text="${episode.rewatchValue} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <progress class="quality-card-fill"
                                      th:value="${episode.rewatchValue}"
                                      max="10"
                                      aria-label="Re-listen value"></progress>
                        </div>
                    </div>
                </div>
            </div>

            <div class="takeaway-section" th:if="${episode.keyTakeaway != null and !episode.keyTakeaway.isBlank()}">
                <div class="section-title">💡 Key Takeaway</div>
                <p class="takeaway-text" th:text="${episode.keyTakeaway}"></p>
            </div>

            <div class="quote-section" th:if="${episode.memorableQuote != null and !episode.memorableQuote.isBlank()}">
                <div class="section-title">Memorable Quote</div>
                <p class="quote-text" th:text="${episode.memorableQuote}"></p>
            </div>

            <div class="mood-section" th:if="${episode.moodTags != null and !episode.moodTags.isBlank()}">
                <div class="section-title">Mood &amp; Vibes</div>
                <p class="mood-text" th:text="${episode.moodTags}"></p>
            </div>

            <div class="feature-flags">
                <span class="feature-flag" th:classappend="${episode.subscribed} ? 'active' : ''"
                      th:text="${episode.subscribed} ? '⭐ Subscribed' : '✗ Not Subscribed'"></span>
                <span class="feature-flag" th:classappend="${episode.recommendToFriend} ? 'active' : ''"
                      th:text="${episode.recommendToFriend} ? '♡ Recommended' : '✗ Not Recommended'"></span>
                <span class="feature-flag" th:classappend="${episode.bookmarkedQuote} ? 'active' : ''"
                      th:text="${episode.bookmarkedQuote} ? '🔖 Quote Bookmarked' : ''"></span>
            </div>

            <div class="review-section" th:if="${episode.review != null and !episode.review.isBlank()}">
                <div class="section-title">My Review</div>
                <p class="review-text" th:text="${episode.review}"></p>
            </div>

            <div class="review-section" th:if="${episode.personalNotes != null and !episode.personalNotes.isBlank()}">
                <div class="section-title">Personal Notes</div>
                <p class="review-text" th:text="${episode.personalNotes}"></p>
            </div>

            <div class="info-rows">
                <div class="info-row" th:if="${episode.mainTopic != null and !episode.mainTopic.isBlank()}">
                    <div class="info-key">Main Topic</div>
                    <div class="info-val" th:text="${episode.mainTopic}"></div>
                </div>
                <div class="info-row" th:if="${episode.seasonNumber != null}">
                    <div class="info-key">Season</div>
                    <div class="info-val" th:text="${episode.seasonNumber}"></div>
                </div>
                <div class="info-row" th:if="${episode.listenedDate != null}">
                    <div class="info-key">Listened</div>
                    <div class="info-val" th:text="${#temporals.format(episode.listenedDate, 'dd MMM yyyy')}"></div>
                </div>
                <div class="info-row" th:if="${episode.addedDate != null}">
                    <div class="info-key">Added</div>
                    <div class="info-val" th:text="${#temporals.format(episode.addedDate, 'dd MMM yyyy')}"></div>
                </div>
                <div class="info-row" th:if="${episode.addedBy != null}">
                    <div class="info-key">Added by</div>
                    <div class="info-val" th:text="${episode.addedBy}"></div>
                </div>
            </div>

            <div class="action-row">
                <a th:href="@{/episodes}" class="btn btn-outline">Back</a>
                <a th:href="@{/episodes/edit/{id}(id=${episode.id})}"
                   class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Edit</a>
                <form th:action="@{/episodes/delete/{id}(id=${episode.id})}" method="post"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Remove this episode?')">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
